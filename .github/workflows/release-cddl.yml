name: Publish SAID CDDL

on:
  push:
    tags:
      - "cddl-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble CDDL export
        run: make -C cddl stream

      - name: Upload CDDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: said-cddl
          path: exports/said.cddl
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download CDDL artifact
        uses: actions/download-artifact@v4
        with:
          name: said-cddl
          path: dist

      - name: Attach CDDL to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/said.cddl

  update-export:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CDDL artifact
        uses: actions/download-artifact@v4
        with:
          name: said-cddl
          path: dist

      - name: Update well-known export
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p exports
          cp dist/said.cddl exports/said.cddl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/said.cddl
          if git diff --cached --quiet; then
            echo "exports/said.cddl is already up to date"
            exit 0
          fi
          git commit -m "Update said.cddl export for ${RELEASE_TAG}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
