name: Publish SAID ASN.1

on:
  push:
    tags:
      - "asn1-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble ASN.1 export
        run: make -C asn1 stream

      - name: Upload ASN.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: said-asn1
          path: exports/said.asn
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download ASN.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: said-asn1
          path: dist

      - name: Attach ASN.1 to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/said.asn

  update-export:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ASN.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: said-asn1
          path: dist

      - name: Update well-known export
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p exports
          cp dist/said.asn exports/said.asn
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/said.asn
          if git diff --cached --quiet; then
            echo "exports/said.asn is already up to date"
            exit 0
          fi
          git commit -m "Update said.asn export for ${RELEASE_TAG}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
